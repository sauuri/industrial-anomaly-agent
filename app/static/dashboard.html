<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-time Anomaly Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 28px; background: #1a1d27; border-bottom: 1px solid #2a2d3a; }
    .header-left h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .header-left p { font-size: 12px; color: #888; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 12px; }

    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4ade80; font-weight: 600; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .status-badge { padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .status-normal { background: #14532d; color: #4ade80; }
    .status-warn   { background: #713f12; color: #fbbf24; }
    .status-danger { background: #7f1d1d; color: #f87171; }

    .btn-stop { padding: 6px 16px; background: #374151; border: none; border-radius: 8px; color: #e0e0e0; font-size: 13px; cursor: pointer; }
    .btn-stop:hover { background: #4b5563; }

    .main { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 65px); }

    .charts-area { padding: 20px; overflow-y: auto; }
    .prob-section { background: #1a1d27; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
    .prob-label { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 8px; }
    .prob-value { font-size: 28px; font-weight: 700; color: #fff; }
    .prob-bar-bg { background: #2a2d3a; border-radius: 8px; height: 14px; overflow: hidden; }
    .prob-bar-fill { height: 100%; border-radius: 8px; transition: width 0.6s, background 0.6s; }
    .failure-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .ftag { background: #7f1d1d; color: #f87171; border-radius: 6px; padding: 3px 10px; font-size: 11px; }

    .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .chart-card { background: #1a1d27; border-radius: 12px; padding: 14px; }
    .chart-card canvas { height: 100px !important; width: 100% !important; }
    .chart-title { font-size: 12px; color: #888; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .chart-val { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 10px; }
    .chart-val span { font-size: 12px; color: #666; font-weight: 400; margin-left: 4px; }

    .sidebar { background: #1a1d27; border-left: 1px solid #2a2d3a; padding: 20px; overflow-y: auto; }
    .sidebar-title { font-size: 13px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }

    .alert-item { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; line-height: 1.5; }
    .alert-danger { background: #2d1515; border-left: 3px solid #f87171; }
    .alert-warn   { background: #2d2315; border-left: 3px solid #fbbf24; }
    .alert-normal { background: #152d1a; border-left: 3px solid #4ade80; }
    .alert-time { color: #666; font-size: 11px; margin-bottom: 3px; }
    .alert-msg { color: #e0e0e0; }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .charts-grid { grid-template-columns: 1fr; }
      .sidebar { border-left: none; border-top: 1px solid #2a2d3a; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>Real-time Anomaly Detection Dashboard</h1>
    <p>Industrial Anomaly Agent — 실시간 센서 모니터링</p>
  </div>
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
    <span class="status-badge status-normal" id="status-badge">정상</span>
    <button class="btn-stop" id="toggle-btn" onclick="toggleStream()">일시정지</button>
  </div>
</div>

<div class="main">
  <div class="charts-area">
    <div class="prob-section">
      <div class="prob-label">
        <span>고장 확률</span>
        <span class="prob-value" id="prob-value">—</span>
      </div>
      <div class="prob-bar-bg"><div class="prob-bar-fill" id="prob-bar" style="width:0%;background:#4ade80"></div></div>
      <div class="failure-tags" id="failure-tags"></div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">공기 온도</div>
        <div class="chart-val" id="val-air">— <span>K</span></div>
        <canvas id="chart-air" height="80"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">공정 온도</div>
        <div class="chart-val" id="val-process">— <span>K</span></div>
        <canvas id="chart-process" height="80"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">회전 속도</div>
        <div class="chart-val" id="val-rpm">— <span>RPM</span></div>
        <canvas id="chart-rpm" height="80"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">토크</div>
        <div class="chart-val" id="val-torque">— <span>Nm</span></div>
        <canvas id="chart-torque" height="80"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">공구 마모</div>
        <div class="chart-val" id="val-wear">— <span>min</span></div>
        <canvas id="chart-wear" height="80"></canvas>
      </div>
      <div class="chart-card">
        <div class="chart-title">고장 확률 추이</div>
        <div class="chart-val" id="val-prob2">— <span>%</span></div>
        <canvas id="chart-prob" height="80"></canvas>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-title">알림 로그</div>
    <div id="alert-log"></div>
  </div>
</div>

<script>
  const MAX_POINTS = 40;
  const chartConfig = (color, ymin, ymax) => ({
    type: "line",
    data: { labels: [], datasets: [{ data: [], borderColor: color, borderWidth: 1.5, pointRadius: 0, tension: 0.4, fill: true, backgroundColor: color + "18" }] },
    options: { animation: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false, min: ymin, max: ymax } }, responsive: true, maintainAspectRatio: false }
  });

  const charts = {
    air:     new Chart(document.getElementById("chart-air"),     chartConfig("#60a5fa",  290, 310)),
    process: new Chart(document.getElementById("chart-process"), chartConfig("#f472b6",  300, 320)),
    rpm:     new Chart(document.getElementById("chart-rpm"),     chartConfig("#a78bfa", 1000, 3000)),
    torque:  new Chart(document.getElementById("chart-torque"),  chartConfig("#34d399",    0,  90)),
    wear:    new Chart(document.getElementById("chart-wear"),    chartConfig("#fb923c",    0, 260)),
    prob:    new Chart(document.getElementById("chart-prob"),    chartConfig("#f87171",    0, 100)),
  };

  function pushData(chart, label, value) {
    chart.data.labels.push(label);
    chart.data.datasets[0].data.push(value);
    if (chart.data.labels.length > MAX_POINTS) {
      chart.data.labels.shift();
      chart.data.datasets[0].data.shift();
    }
    chart.update();
  }

  let ws, paused = false;
  let alertCount = 0;

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws/stream`);

    ws.onmessage = (e) => {
      if (paused) return;
      const d = JSON.parse(e.data);
      const s = d.sensors;
      const prob = d.failure_probability;
      const ts = d.timestamp;

      // 센서값 업데이트
      document.getElementById("val-air").innerHTML = s.air_temperature.toFixed(1) + " <span>K</span>";
      document.getElementById("val-process").innerHTML = s.process_temperature.toFixed(1) + " <span>K</span>";
      document.getElementById("val-rpm").innerHTML = Math.round(s.rotational_speed) + " <span>RPM</span>";
      document.getElementById("val-torque").innerHTML = s.torque.toFixed(1) + " <span>Nm</span>";
      document.getElementById("val-wear").innerHTML = Math.round(s.tool_wear) + " <span>min</span>";
      document.getElementById("val-prob2").innerHTML = prob.toFixed(1) + " <span>%</span>";

      pushData(charts.air,     ts, s.air_temperature);
      pushData(charts.process, ts, s.process_temperature);
      pushData(charts.rpm,     ts, s.rotational_speed);
      pushData(charts.torque,  ts, s.torque);
      pushData(charts.wear,    ts, s.tool_wear);
      pushData(charts.prob,    ts, prob);

      // 확률 바
      document.getElementById("prob-value").textContent = prob.toFixed(1) + "%";
      const barColor = prob >= 60 ? "#f87171" : prob >= 30 ? "#fbbf24" : "#4ade80";
      const bar = document.getElementById("prob-bar");
      bar.style.width = prob + "%";
      bar.style.background = barColor;

      // 상태 배지
      const badge = document.getElementById("status-badge");
      if (prob >= 60) { badge.className = "status-badge status-danger"; badge.textContent = "고장 위험"; }
      else if (prob >= 30) { badge.className = "status-badge status-warn"; badge.textContent = "주의 필요"; }
      else { badge.className = "status-badge status-normal"; badge.textContent = "정상"; }

      // 고장 유형 태그
      const tagsEl = document.getElementById("failure-tags");
      tagsEl.innerHTML = d.failure_types.length
        ? d.failure_types.map(t => `<span class="ftag">${t}</span>`).join("")
        : "";

      // 알림 로그 (고장/주의만 기록)
      if (prob >= 30 && alertCount < 50) {
        const cls = prob >= 60 ? "alert-danger" : "alert-warn";
        const icon = prob >= 60 ? "🔴" : "🟡";
        const msg = d.failure_types.length ? d.failure_types.map(t => t.split("(")[0].trim()).join(", ") : "이상 감지";
        const item = document.createElement("div");
        item.className = `alert-item ${cls}`;
        item.innerHTML = `<div class="alert-time">${ts}</div><div class="alert-msg">${icon} ${msg} — ${prob.toFixed(1)}%</div>`;
        const log = document.getElementById("alert-log");
        log.insertBefore(item, log.firstChild);
        alertCount++;
        if (log.children.length > 30) log.removeChild(log.lastChild);
      }
    };

    ws.onclose = () => {
      if (!paused) setTimeout(connect, 2000);
    };
  }

  function toggleStream() {
    const btn = document.getElementById("toggle-btn");
    paused = !paused;
    btn.textContent = paused ? "재개" : "일시정지";
    if (!paused && ws.readyState !== WebSocket.OPEN) connect();
  }

  connect();
</script>
</body>
</html>
